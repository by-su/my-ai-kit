name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python3 -m py_compile bin/mykit src/*.py adapters/*.py
      - name: Run tests
        run: python3 -m unittest discover -s tests
