version: "1.0"

# 에이전트 공통 설정 / MCP 관리
global:
  mcp_servers:
    context7:
      command: "npx"
      args:
        - "-y"
        - "@context7/mcp-server"

    github:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-github"
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

    google-docs:
      command: "npx"
      args:
        - "-y"
        - "@a-bonus/google-docs-mcp"
      env:
        GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
        GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"

    google-slides:
      command: "npx"
      args:
        - "-y"
        - "@a-bonus/google-slides-mcp"

    mysql:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-mysql"
      env:
        MYSQL_HOST: "${MYSQL_HOST}"
        MYSQL_USER: "${MYSQL_USER}"
        MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
        MYSQL_DATABASE: "${MYSQL_DATABASE}"

    playwright:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-playwright"

    memory:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-memory"

    brave-search:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-brave-search"
      env:
        BRAVE_API_KEY: "${BRAVE_API_KEY}"

# 스택 프로필 정의 (개인용 / 회사용 / 전체 모드)
profiles:
  personal:
    description: "개인 개발 스택 (TS/JS, React, Next, Nest, Python, FastAPI, Java, Kotlin, SpringBoot, Prisma, MySQL)"
    include:
      - typescript
      - javascript
      - react
      - react-native
      - next
      - nest
      - python
      - fastapi
      - java
      - kotlin
      - springboot
      - jpa
      - prisma
      - mysql

  work:
    description: "회사 개발 스택 (커스텀 설정 가능)"
    include:
      - typescript
      - javascript
      - react
      - node
      - docker
      - aws
      - postgres

  full:
    description: "전체 스킬 모드 (필터링 없이 270+ 스킬 모두 로드)"
    include:
      - "*"

# 항상 자동 설치되는 Core 스크립트 & 스킬
core:
  - name: "core-git-workflow"
    source: "local"
    path: "core/git-workflow"

# 필요할 때 켜고 끌 수 있는 Optional 스킬
optional:
  - name: "db-helper"
    description: "PostgreSQL & DB 마이그레이션 도우미"
    source: "local"
    path: "optional/db-helper"
    default_enabled: true

  - name: "ecc-suite"
    description: "Everything Claude Code (스택 프로필 기반 맞춤형 스킬 팩)"
    source: "local"
    path: "~/.agent-skills/store/ecc-pruned-skills"
    default_enabled: true

  - name: "mengto-skills"
    description: "MengTo Design & UI/UX 스킬 팩 (iOS, SwiftUI, React, Design System)"
    source: "github"
    url: "https://github.com/MengTo/Skills.git"
    auto_update: true
    default_enabled: true

  - name: "prompt-architect"
    description: "프롬프트 아키텍팅 & 시스템 지침 설계 스킬 (필요 시 온디맨드 설치)"
    source: "github"
    url: "https://github.com/ckelsoe/prompt-architect.git"
    auto_update: true
    default_enabled: false

# 동기화할 에이전트 대상
targets:
  claude_code: true
  antigravity: true
  codex: true
