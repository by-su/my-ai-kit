version: "1.0"

# 스킬 설치 시 자동 중복 탐지 훅 켜기
auto_dedupe_on_install: true

# 안전한 명령어 자동 승인 목록 (매번 허락 묻지 않음!)
auto_approve_commands:
  - "git"
  - "ls"
  - "cat"
  - "head"
  - "tail"
  - "grep"
  - "rg"
  - "find"
  - "pwd"
  - "echo"
  - "python3"
  - "python"
  - "node"
  - "npx"
  - "npm test"
  - "npm run build"
  - "npm run dev"
  - "yarn test"
  - "pnpm test"
  - "pytest"
  - "mykit"

# Claude Code 세션 기본 환경변수 (settings.json의 env로 동기화, 기존 값은 덮어쓰지 않음)
# GateGuard fact-forcing 훅: 자체 A/B 테스트(gated vs ungated, 함수 단위 채점) 결과
# 이 정도 복잡도의 태스크에서는 품질 차이가 없고 순수 마찰비용만 발생해 기본 비활성화합니다.
claude_env_defaults:
  GATEGUARD_DISABLED: "1"

# 에이전트 공통 설정 / MCP 관리
global:
  mcp_servers:
    context7:
      command: "npx"
      args:
        - "-y"
        - "@context7/mcp-server"
      enabled: true

    github:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-github"
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
      enabled: true

    google-docs:
      command: "npx"
      args:
        - "-y"
        - "@a-bonus/google-docs-mcp"
      env:
        GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
        GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      enabled: true

    google-slides:
      command: "npx"
      args:
        - "-y"
        - "@a-bonus/google-slides-mcp"
      enabled: true

    mysql:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-mysql"
      env:
        MYSQL_HOST: "${MYSQL_HOST}"
        MYSQL_USER: "${MYSQL_USER}"
        MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
        MYSQL_DATABASE: "${MYSQL_DATABASE}"
      enabled: false

    playwright:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-playwright"
      enabled: false

    memory:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-memory"
      enabled: true

    brave-search:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-brave-search"
      env:
        BRAVE_API_KEY: "${BRAVE_API_KEY}"
      enabled: true

  # Codex CLI는 명령어 단위 승인 목록이 없고 sandbox_mode + approval_policy로만 위험도를 제어합니다.
  # approval_policy를 "never"로 바꾸면 승인 프롬프트를 완전히 끌 수 있습니다(비권장).
  codex:
    sandbox_mode: "workspace-write"
    approval_policy: "on-request"

# 스택 프로필 정의 (개인용 / 회사용 / 전체 모드)
profiles:
  personal:
    description: "개인 개발 스택 (TS/JS, React, Next, Nest, Python, FastAPI, Java, Kotlin, SpringBoot, Prisma, MySQL)"
    include:
      - typescript
      - javascript
      - react
      - react-native
      - next
      - nest
      - python
      - fastapi
      - java
      - kotlin
      - springboot
      - jpa
      - prisma
      - mysql

  work:
    description: "회사 개발 스택 (커스텀 설정 가능)"
    include:
      - typescript
      - javascript
      - react
      - node
      - docker
      - aws
      - postgres

  full:
    description: "전체 스킬 모드 (필터링 없이 270+ 스킬 모두 로드)"
    include:
      - "*"

  pm:
    description: "PM / Product 스택 (PRD, User Story, Roadmap, PDLC)"
    include:
      - planning
      - product
      - research
    enable_optionals:
      - pm-skills
      - pm-pdlc-conductor

# 항상 자동 설치되는 Core 스크립트 & 스킬
core: []

# 필요할 때 켜고 끌 수 있는 Optional 스킬
optional:
  - name: "ecc-suite"
    description: "Everything Claude Code (스택 프로필 기반 맞춤형 스킬 팩)"
    source: "github"
    url: "https://github.com/affaan-m/everything-claude-code.git"
    path: "~/.agent-skills/store/profiles/<profile>/ecc-suite"
    auto_update: false
    default_enabled: true

  - name: "mengto-skills"
    description: "MengTo Design & UI/UX 스킬 팩 (iOS, SwiftUI, React, Design System)"
    source: "github"
    url: "https://github.com/MengTo/Skills.git"
    path: "~/.agent-skills/store/profiles/<profile>/mengto-skills"
    auto_update: false
    default_enabled: true

  - name: "prompt-architect"
    description: "프롬프트 아키텍팅 & 시스템 지침 설계 스킬 (필요 시 온디맨드 설치)"
    source: "github"
    url: "https://github.com/ckelsoe/prompt-architect.git"
    auto_update: false
    default_enabled: false

  - name: "app-store-screenshots"
    description: "App Store & Google Play 마케팅 스크린샷 디자인 스킬 팩"
    source: "github"
    url: "https://github.com/ParthJadhav/app-store-screenshots.git"
    auto_update: false
    default_enabled: false

  - name: "spec-kit"
    description: "GitHub SpecKit - Spec-Driven Development (SDD) 명세 기반 기획 및 개발 파이프라인 팩"
    source: "github"
    url: "https://github.com/github/spec-kit.git"
    auto_update: false
    default_enabled: false

  - name: "promptfoo"
    description: "Promptfoo - LLM 앱 보안 테스트 및 평가 프레임워크 팩"
    source: "github"
    url: "https://github.com/promptfoo/promptfoo.git"
    auto_update: false
    default_enabled: false

  - name: "inspect-ai"
    description: "Inspect AI - UK AISI의 LLM 평가 및 안전성 검증 프레임워크 팩"
    source: "github"
    url: "https://github.com/UKGovernmentBEIS/inspect_ai.git"
    auto_update: false
    default_enabled: false

  - name: "screenshot-to-code"
    description: "Screenshot to Code - 스크린샷/목업을 HTML, Tailwind, React 코드로 변환하는 스킬 팩"
    source: "github"
    url: "https://github.com/abi/screenshot-to-code.git"
    auto_update: false
    default_enabled: false

  - name: "openui"
    description: "W&B OpenUI - AI 기반 UI 컴포넌트 생성 및 에디터 팩"
    source: "github"
    url: "https://github.com/wandb/openui.git"
    auto_update: false
    default_enabled: false

  - name: "storybook"
    description: "Storybook - UI 컴포넌트 개발 및 문서화 워크숍 스킬 팩"
    source: "github"
    url: "https://github.com/storybookjs/storybook.git"
    auto_update: false
    default_enabled: false

  - name: "shadcn-ui"
    description: "shadcn/ui - Radix UI & Tailwind CSS 기반 재사용 가능한 UI 컴포넌트 팩"
    source: "github"
    url: "https://github.com/shadcn-ui/ui.git"
    auto_update: false
    default_enabled: false

  - name: "coolify"
    description: "Coolify - 오픈소스 셀프호스팅 및 배포 플랫폼"
    source: "github"
    url: "https://github.com/coolifyio/coolify.git"
    auto_update: false
    default_enabled: false

  - name: "copilotkit"
    description: "CopilotKit - 제품 내 AI 코파일럿 및 에이전트 UI 프레임워크"
    source: "github"
    url: "https://github.com/CopilotKit/CopilotKit.git"
    auto_update: false
    default_enabled: false

  - name: "posthog"
    description: "PostHog - 제품 분석, feature flags, session replay 플랫폼"
    source: "github"
    url: "https://github.com/PostHog/posthog.git"
    auto_update: false
    default_enabled: false

  - name: "pm-skills"
    description: "Product on Purpose PM (Product Management) 스킬 팩 (PRD, User Story, Roadmap 등)"
    source: "github"
    url: "https://github.com/product-on-purpose/pm-skills.git"
    auto_update: false
    default_enabled: false

  - name: "pm-pdlc-conductor"
    description: "pm-skills를 활용해 Triple Diamond PDLC(Discover~Iterate)로 PM 역할 수행을 안내하는 로컬 스킬"
    source: "local"
    path: "skills/pm-pdlc-conductor"
    auto_update: false
    default_enabled: false

# 동기화할 에이전트 대상
targets:
  claude_code: true
  antigravity: true
  codex: true
